<style>
.wgt{--ink:#333;--muted:#888;--rule:#ddd;--grid:#eee;--acc:#4582ec;
     --a1:#4582ec;--a2:#d9534f;
     --mono:Menlo,Consolas,"DejaVu Sans Mono",monospace}
.wgt p.lede{color:var(--muted);max-width:64ch}
.wgt .eq{font-family:var(--mono);font-size:13px;line-height:2.1;
  border-left:3px solid var(--rule);padding:.35rem 0 .35rem 1rem;margin:0 0 1.5rem;
  overflow-x:auto;white-space:nowrap}
.wgt .eq span{color:var(--muted)}
.wgt .plot{background:#fff;border:1px solid var(--rule);border-radius:4px;
  padding:10px 8px 4px;margin-bottom:1rem}
.wgt canvas{display:block;width:100%;height:320px;touch-action:none;max-width:none}
.wgt canvas.short{height:190px}
.wgt .key{display:flex;flex-wrap:wrap;gap:20px;font-family:var(--mono);font-size:11.5px;
  color:var(--muted);padding:2px 6px 8px}
.wgt .key i{display:inline-block;width:20px;height:0;border-top-width:2px;
  vertical-align:.28em;margin-right:7px}
.wgt .readout{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  min-height:1.4em;padding:6px 6px 2px}
.wgt .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:1rem 2rem;margin:1.75rem 0 0}
.wgt .ctl{display:flex;align-items:center;gap:.65rem}
.wgt .ctl label{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  min-width:80px;margin:0;font-weight:normal}
.wgt .ctl input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:18px;padding:0}
.wgt .ctl input[type=number]{width:72px;font-family:var(--mono);font-size:12px;
  padding:4px 6px;border:1px solid var(--rule);border-radius:2px}
.wgt .ctl output{font-family:var(--mono);font-size:12px;min-width:58px;text-align:right;
  font-variant-numeric:tabular-nums}
.wgt .unit{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wgt button{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-radius:2px;padding:7px 12px;cursor:pointer}
.wgt button:hover{border-color:var(--muted)}
.wgt .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:4px;margin:2rem 0 0;overflow:hidden}
.wgt .stat{background:#fff;padding:.7rem .85rem}
.wgt .stat dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin:0 0 .25rem;font-weight:normal}
.wgt .stat dd{margin:0;font-family:var(--mono);font-size:17px;
  font-variant-numeric:tabular-nums}
.wgt .note{font-size:13px;color:var(--muted);max-width:64ch;margin-top:2rem}
.wgt .note code{font-family:var(--mono);font-size:12px}
@media (max-width:520px){.wgt canvas{height:250px}.wgt canvas.short{height:160px}}
</style>
